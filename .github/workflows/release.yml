name: Release

on:
  push:
    tags:
      - '[0-9]*-[0-9]*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/blender-tests.yml
    permissions:
      contents: read

  release:
    name: Create release
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build add-on zip and release notes
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/build_release.py --out-dir dist --tag "${TAG}"

      - name: Show zip contents
        run: unzip -l "${{ steps.build.outputs.zip }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          TITLE: ${{ steps.build.outputs.title }}
          ZIP: ${{ steps.build.outputs.zip }}
          NOTES: ${{ steps.build.outputs.notes }}
        run: |
          gh release create "${TAG}" "${ZIP}" \
            --verify-tag \
            --title "${TITLE}" \
            --notes-file "${NOTES}"
